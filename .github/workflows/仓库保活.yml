name: 仓库保活

on:
  schedule:
    # 每 20 天一次，留 3 倍余量对抗 GitHub 的 60 天无活动禁用规则
    - cron: '0 0 */20 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 关键：不持久化 GITHUB_TOKEN，否则它会覆盖下面 push 用的 PAT，
          # 提交身份又变成 github-actions[bot]，保活等于白做。
          persist-credentials: false

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}

          ---
          *Auto-generated by [仓库保活 workflow](.github/workflows/仓库保活.yml)*
          EOF

      - name: 提交并推送（以本人身份，重置 schedule 计时器）
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::未配置 PAT，无法以本人身份提交，schedule 计时器不会重置"
            exit 1
          fi

          # 本人身份提交：bot 提交不计入活动判定
          git config --local user.email "24671281+Crackday@users.noreply.github.com"
          git config --local user.name "Crackday"

          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "保活提交成功（本人身份）"
          fi
