name: 签到

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

# 防止外部定时器与内置 cron 同时触发时重复签到
concurrency:
  group: kgm-checkin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 随机延迟（仅定时触发，落在北京时间 08:00-10:00）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$(( RANDOM % 121 ))
          echo "本次延迟 ${DELAY} 分钟，预计北京时间 08:00 后约 ${DELAY} 分钟开始签到"
          sleep ${DELAY}m

      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 关键：不持久化 GITHUB_TOKEN，否则会覆盖下面 push 用的 PAT
          persist-credentials: false

      - name: 创建 Node 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: 检查 GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version

      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        run: npm run install

      - name: 执行签到
        run: npm run main
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 自保活：签到本身每天跑，顺手在满 20 天时用本人身份提交一次，
      # 从根上解决「GitHub 因 60 天无活动禁用 schedule」的问题。
      # 用 always() 保证签到失败时也执行，否则失败会让计时器继续倒数。
      - name: 刷新保活时间戳（防止 schedule 被 GitHub 禁用）
        if: always()
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "未配置 PAT，跳过保活（schedule 仍可能被禁用）"
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(grep -oE '\*\*Last Update:\*\* [0-9]{4}-[0-9]{2}-[0-9]{2}' .github/KEEPALIVE.md 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)

          if [ -n "$LAST" ]; then
            DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            echo "距上次保活 ${DAYS} 天"
            if [ "$DAYS" -lt 20 ]; then
              echo "未满 20 天，跳过本次保活提交"
              exit 0
            fi
          fi

          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}

          ---
          *Auto-generated by [签到 workflow](.github/workflows/签到.yml)*
          EOF

          git config --local user.email "24671281+Crackday@users.noreply.github.com"
          git config --local user.name "Crackday"
          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at ${TODAY}"
            git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "保活提交成功"
          fi
